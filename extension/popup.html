<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HowConnected</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="brand-row">
        <div class="brand" aria-label="HowConnected">
          <span class="logo" aria-hidden="true">
            <span class="logo-dot dot-coral"></span>
            <span class="logo-line"></span>
            <span class="logo-dot dot-teal"></span>
          </span>
          <span>HowConnected</span>
        </div>
        <span class="release-badge">Version 1.1</span>
      </header>

      <button id="play-daily" class="daily-button" type="button">
        <span class="daily-kicker">Daily challenge</span>
        <span class="daily-title">Play The Missing Link <span aria-hidden="true">→</span></span>
        <span class="daily-copy">One verified connection puzzle every day.</span>
      </button>

      <section class="intro" aria-labelledby="popup-title">
        <p class="eyebrow">Wikipedia companion</p>
        <h1 id="popup-title">Connect this Wikipedia article.</h1>
        <div class="detection-row">
          <span id="detection-indicator" class="status-indicator" data-loading="true" aria-hidden="true"></span>
          <p id="detection-status" class="status" role="status" aria-live="polite">
            Checking the current article…
          </p>
        </div>
        <p class="support-note">Works on standard English Wikipedia article pages. You can always search manually.</p>
      </section>

      <form id="connection-form" novalidate>
        <div class="field-group" data-field="source">
          <div class="label-row">
            <label for="source-input">From this article</label>
            <button id="change-source" class="text-button" type="button" hidden>Change</button>
          </div>
          <div class="input-shell">
            <span class="node node-coral" aria-hidden="true"></span>
            <input
              id="source-input"
              type="text"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="source-results"
              aria-expanded="false"
              autocomplete="off"
              maxlength="100"
              placeholder="Search for the first entity"
            >
          </div>
          <p id="source-selection" class="selected-entity" aria-live="polite" hidden></p>
          <ul id="source-results" class="results" role="listbox" aria-label="First entity suggestions" hidden></ul>
        </div>

        <div class="connector" aria-hidden="true"><span></span><b>to</b><span></span></div>

        <div class="field-group" data-field="target">
          <label for="target-input">Connect it to</label>
          <div class="input-shell">
            <span class="node node-teal" aria-hidden="true"></span>
            <input
              id="target-input"
              type="text"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="target-results"
              aria-expanded="false"
              autocomplete="off"
              maxlength="100"
              placeholder="Search people, places, or ideas"
            >
          </div>
          <p id="target-selection" class="selected-entity" aria-live="polite" hidden></p>
          <ul id="target-results" class="results" role="listbox" aria-label="Second entity suggestions" hidden></ul>
        </div>

        <p id="form-message" class="form-message" role="alert" aria-live="assertive"></p>
        <button id="find-button" class="primary-button" type="submit" aria-disabled="true" data-disabled="true">
          <span id="find-button-label">Find connection</span> <span aria-hidden="true">→</span>
        </button>
      </form>

      <footer>
        <button id="open-site" class="footer-link" type="button">Open HowConnected</button>
        <span aria-hidden="true">·</span>
        <button id="open-extension-info" class="footer-link" type="button">How it works &amp; privacy</button>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
